name: Air fares monthly reconciliation

# ONS publish the CPI bulletin mid-month, and that bulletin retrospectively
# confirms the *previous* month's index day. The exact publication date moves
# around within the middle of the month, so rather than guess it we attempt the
# reconciliation daily across the 15th-25th. Attempts made before the bulletin
# is out exit cleanly as a no-op (HTTP 404 on the bulletin URL is an expected
# state, not a failure); the first attempt after publication does the work.
#
# The distinction that matters for alerting:
#   * bulletin not published yet        -> exit 0, notice     (we are early)
#   * bulletin published, cannot parse  -> exit 1, error      (our parser broke)
# Without that split, a broken parser would look identical to being early and we
# would silently skip a month forever.

on:
  schedule:
    - cron: "0 12 15-25 * *"
  workflow_dispatch:
    inputs:
      index_month:
        description: "Month to reconstruct (YYYY-MM). Blank = last month."
        required: false
        type: string
      index_day:
        description: "Confirmed index day (YYYY-MM-DD), skipping the bulletin fetch."
        required: false
        type: string

concurrency:
  group: airfares-reconcile
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uk-airfares
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uk-airfares/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keyless auth via Workload Identity Federation. Service-account JSON
      # keys are blocked by the iam.disableServiceAccountKeyCreation org policy
      # (Google's secure-by-default for new projects), and WIF is the
      # recommended alternative regardless: GitHub mints a short-lived OIDC
      # token per run, so there is no long-lived credential to leak or rotate.
      # Requires `permissions: id-token: write`, set at the top of this file.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # Refreshes weights.csv in the ephemeral checkout so the reconstruction
      # uses real ONS weights rather than the committed placeholders. Allowed to
      # fail: without weights the per-haul reconstructions are still correct and
      # useful, only the weighted "all" aggregate is skipped -- and every row
      # carries weights_are_placeholder so validation downgrades the verdict
      # accordingly. A failure here degrades the output visibly; it does not
      # corrupt it, so it should not block the month's reconstruction.
      - name: Refresh ONS sub-index weights
        id: weights
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m ukairfares.onsweights --discover

      - name: Warn if weights could not be refreshed
        if: steps.weights.outcome == 'failure'
        run: |
          echo "::warning::Could not fetch ONS weights; reconstruction will use \
          placeholders and skip the weighted aggregate. Run \
          'python -m ukairfares.onsweights --dump' to inspect the release layout."

      - name: Reconstruct sub-indices
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          # This job reads BigQuery and ONS; it never queries a fare
          # provider, so it needs no fare-API credential.
          FARE_PROVIDER: mock
          PYTHONPATH: src
        run: |
          python -m ukairfares.reconcile \
            ${{ inputs.index_month && format('--index-month {0}', inputs.index_month) || '' }} \
            ${{ inputs.index_day && format('--index-day {0}', inputs.index_day) || '' }} \
            | tee reconcile-summary.json

      - name: Score against published ONS values
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          # This job reads BigQuery and ONS; it never queries a fare
          # provider, so it needs no fare-API credential.
          FARE_PROVIDER: mock
          PYTHONPATH: src
        run: python -m ukairfares.validate | tee validation-report.json

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Air fares reconciliation"
            echo ""
            for f in reconcile-summary.json validation-report.json; do
              if [ -s "$f" ]; then
                echo "#### $f"
                echo '```json'
                cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-${{ github.run_id }}
          path: |
            uk-airfares/reconcile-summary.json
            uk-airfares/validation-report.json
          if-no-files-found: ignore
          retention-days: 90
