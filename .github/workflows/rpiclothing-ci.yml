name: RPI clothing CI

# Tests on push/PR, plus weekly so a repository nobody touches still finds out
# about a break before a monthly run does. Reports are excluded: digest
# commits change no code. actionlint is scoped to this project's workflows so
# a neighbour's mistake cannot turn this suite red.
on:
  push:
    paths:
      - "uk-rpi-clothing/**"
      - "!uk-rpi-clothing/reports/**"
      - ".github/workflows/rpiclothing-*.yml"
  pull_request:
    paths:
      - "uk-rpi-clothing/**"
      - "!uk-rpi-clothing/reports/**"
      - ".github/workflows/rpiclothing-*.yml"
  schedule:
    - cron: "23 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: uk-rpi-clothing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uk-rpi-clothing/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/rpiclothing-*.yml

  latest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: uk-rpi-clothing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy google-cloud-bigquery pytest
      - run: python -m pytest
