name: Air fares ONS published-series backfill

# Loads ONS's own published sub-indices -- the validation answer key -- from the
# ad hoc release into `ons_published_index`.
#
# Deliberately on its own monthly schedule rather than inside the reconciliation
# workflow. Reconciliation retries daily across the 15th-25th waiting for the
# CPI bulletin, and this table is append-only with one vintage per run, so
# attaching the backfill there would write ten near-identical vintages of the
# same ~96 months every month. Once a month is plenty: the ad hoc release is
# republished a few times a year at most.
#
# Revisions are handled by vintaging, not overwriting -- if ONS revise a past
# value, a new vintage lands alongside the old one and `fetched_ts` orders them,
# so a figure we scored against last month is never silently rewritten.

on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:
    inputs:
      release_url:
        description: "Ad hoc release page URL. Blank = pinned default."
        required: false
        type: string
      discover:
        description: "Search ONS for a newer release first"
        required: false
        type: boolean
        default: true

concurrency:
  group: airfares-backfill
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uk-airfares
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uk-airfares/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keyless auth via Workload Identity Federation. Service-account JSON
      # keys are blocked by the iam.disableServiceAccountKeyCreation org policy
      # (Google's secure-by-default for new projects), and WIF is the
      # recommended alternative regardless: GitHub mints a short-lived OIDC
      # token per run, so there is no long-lived credential to leak or rotate.
      # Requires `permissions: id-token: write`, set at the top of this file.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Ensure BigQuery tables exist
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
        run: python -m ukairfares.ensure_tables

      - name: Backfill published sub-indices
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          # This job reads BigQuery and ONS; it never queries a fare
          # provider, so it needs no fare-API credential.
          FARE_PROVIDER: mock
          PYTHONPATH: src
        run: |
          python -m ukairfares.backfill \
            ${{ inputs.release_url && format('--release-url {0}', inputs.release_url) || '' }} \
            ${{ (inputs.discover == false) && '' || '--discover' }} \
            | tee backfill-summary.json

      - name: Refresh weights from the same release
        env:
          PYTHONPATH: src
        run: python -m ukairfares.onsweights --discover

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### ONS published-series backfill"
            echo ""
            if [ -s backfill-summary.json ]; then
              echo '```json'
              cat backfill-summary.json
              echo '```'
            else
              echo "No summary produced — the run failed before completing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ons-backfill-${{ github.run_id }}
          path: uk-airfares/backfill-summary.json
          if-no-files-found: ignore
          retention-days: 90
