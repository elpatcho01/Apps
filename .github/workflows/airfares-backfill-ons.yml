name: Air fares ONS published-series backfill

# Loads ONS's own published sub-indices -- the validation answer key -- from the
# ad hoc release into `ons_published_index`.
#
# Deliberately on its own monthly schedule rather than inside the reconciliation
# workflow. Reconciliation retries daily across the 15th-25th waiting for the
# CPI bulletin, and this table is append-only with one vintage per run, so
# attaching the backfill there would write ten near-identical vintages of the
# same ~96 months every month. Once a month is plenty: the ad hoc release is
# republished a few times a year at most.
#
# Revisions are handled by vintaging, not overwriting -- if ONS revise a past
# value, a new vintage lands alongside the old one and `fetched_ts` orders them,
# so a figure we scored against last month is never silently rewritten.

on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:
    inputs:
      release_url:
        description: "Ad hoc release page URL. Blank = pinned default."
        required: false
        type: string
      discover:
        description: "Search ONS for a newer release first"
        required: false
        type: boolean
        default: true

concurrency:
  group: airfares-backfill
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uk-airfares
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uk-airfares/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keyless auth via Workload Identity Federation. Service-account JSON
      # keys are blocked by the iam.disableServiceAccountKeyCreation org policy
      # (Google's secure-by-default for new projects), and WIF is the
      # recommended alternative regardless: GitHub mints a short-lived OIDC
      # token per run, so there is no long-lived credential to leak or rotate.
      # Requires `permissions: id-token: write`, set at the top of this file.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Ensure BigQuery tables exist
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET || secrets.BQ_DATASET }}
          PYTHONPATH: src
        run: python -m ukairfares.ensure_tables

      - name: Backfill published sub-indices
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET || secrets.BQ_DATASET }}
          PYTHONPATH: src
          DISCOVER: ${{ inputs.discover }}
        run: |
          # Without this, the exit status is tee's, not the command's, so a
          # non-zero exit is silently swallowed and the run reports green.
          set -o pipefail
          # In bash, not a ${{ }} ternary. `cond && '' || '--flag'` is broken:
          # GitHub's expression language treats an empty string as falsy, so the
          # `||` branch always wins and --discover could never be switched off.
          # Empty (a scheduled run, where dispatch defaults do not apply) is
          # treated as on, matching the declared default.
          ARGS=()
          if [ -n "${{ inputs.release_url }}" ]; then
            ARGS+=(--release-url "${{ inputs.release_url }}")
          fi
          if [ "$DISCOVER" != "false" ]; then ARGS+=(--discover); fi
          echo "::notice::backfill ${ARGS[*]}"
          python -m ukairfares.backfill "${ARGS[@]}" | tee backfill-summary.json

      # Allowed to fail. The sub-index backfill above is the valuable work and
      # has already been written by this point; weights only affect the weighted
      # "all" aggregate, and every reconstructed row carries
      # weights_are_placeholder so the degradation is visible rather than
      # silent. Failing the whole job here would report a successful backfill as
      # a red run.
      - name: Refresh weights from the same release
        id: weights
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m ukairfares.onsweights --discover

      - name: Warn if weights could not be refreshed
        if: steps.weights.outcome == 'failure'
        run: |
          echo "::warning::Sub-indices loaded, but ONS weights could not be \
          parsed. The weighted aggregate will be skipped and rows flagged \
          weights_are_placeholder. Run 'python -m ukairfares.onsweights --dump' \
          to inspect the workbook layout." 

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### ONS published-series backfill"
            echo ""
            if [ -s backfill-summary.json ]; then
              echo '```json'
              cat backfill-summary.json
              echo '```'
            else
              echo "No summary produced — the run failed before completing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ons-backfill-${{ github.run_id }}
          path: uk-airfares/backfill-summary.json
          if-no-files-found: ignore
          retention-days: 90
