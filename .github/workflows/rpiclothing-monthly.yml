name: RPI clothing monthly

# Computes the WS1 exposure table and the wedge from the latest ONS release,
# appends them to BigQuery, and writes and COMMITS the monthly digest and the
# analytics export.
#
# Runs on the 22nd: the CPI/RPI release lands mid-month (the 3rd Wednesday
# or thereabouts), so by the 22nd the month is always out.
#
# Failure posture is inverted, as in airfares-monthly-digest.yml: the job
# must always reach its commit step. GitHub disables scheduled workflows after
# 60 days without a commit, and workflow runs do not count, so this commit is
# what keeps the schedule alive. Sections that fail become lines in the
# digest; the run still ends red (last step) so the failure is visible.

on:
  schedule:
    - cron: "17 8 22 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to file the digest under (YYYY-MM). Blank = last month."
        required: false
        type: string
      commit:
        description: "Commit the digest (true/false)"
        required: false
        type: string
        default: "true"

concurrency:
  group: rpiclothing-monthly
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: uk-rpi-clothing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uk-rpi-clothing/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve target month
        id: month
        env:
          MONTH_INPUT: ${{ inputs.month }}
          TZ: UTC
        run: |
          MONTH="${MONTH_INPUT:-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)}"
          echo "month=${MONTH}" >> "$GITHUB_OUTPUT"

      # BigQuery is optional until GCP is configured for this project: without
      # the secrets the run computes and commits the digest in DRY_RUN mode, so
      # the schedule stays alive and the numbers are still produced.
      - name: Decide BigQuery mode
        id: mode
        env:
          HAS_WIF: ${{ secrets.GCP_WIF_PROVIDER != '' }}
        run: |
          if [ "$HAS_WIF" = "true" ]; then echo "dry=0" >> "$GITHUB_OUTPUT"; else
            echo "::notice::GCP not configured; running in DRY_RUN mode"
            echo "dry=1" >> "$GITHUB_OUTPUT"; fi

      - name: Authenticate to Google Cloud
        if: steps.mode.outputs.dry == '0'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Ensure BigQuery tables exist
        if: steps.mode.outputs.dry == '0'
        continue-on-error: true
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.RPICLOTHING_BQ_DATASET || 'rpi_clothing' }}
          PYTHONPATH: src
        run: python -m rpiclothing.ensure_tables

      - name: Compute and write the digest
        id: generate
        continue-on-error: true
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.RPICLOTHING_BQ_DATASET || 'rpi_clothing' }}
          DRY_RUN: ${{ steps.mode.outputs.dry }}
          FAN_CANDIDATE: ${{ vars.RPICLOTHING_FAN_CANDIDATE || 'unconditional' }}
          PANEL_VENDOR: ${{ vars.RPICLOTHING_PANEL_VENDOR || '' }}
          PYTHONPATH: src
        run: python -m rpiclothing.monthly --month "${{ steps.month.outputs.month }}"

      - name: Write a placeholder if generation failed
        if: steps.generate.outcome == 'failure'
        env:
          MONTH: ${{ steps.month.outputs.month }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p reports
          printf '# RPI clothing & footwear digest — %s\n\n**Digest generation failed.** See <%s>.\n\nCommitted regardless: this commit resets the 60-day scheduled-workflow clock.\n' \
            "$MONTH" "$RUN_URL" > "reports/${MONTH}.md"

      - name: Publish to run summary
        if: always()
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          if [ -s "reports/${MONTH}.md" ]; then cat "reports/${MONTH}.md" >> "$GITHUB_STEP_SUMMARY"; fi

      # Gate in bash, not in `if:` -- see the uk-airfares README: on a schedule
      # `inputs.commit` is null, and `null != false` is false in GitHub's
      # expression language, which once skipped this step on every scheduled run.
      - name: Commit the digest
        if: always()
        env:
          MONTH: ${{ steps.month.outputs.month }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ "${COMMIT}" = "false" ]; then echo "::notice::commit=false; skipping"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then echo "::notice::unchanged; nothing to commit"; exit 0; fi
          git commit -m "RPI clothing digest for ${MONTH}" \
                     -m "Generated by the monthly workflow. Also resets the 60-day scheduled-workflow clock."
          for delay in 0 2 4 8 16; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          echo "::error::could not push the digest commit"
          exit 1

      - name: Fail the run if generation failed
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::digest generation failed (placeholder committed)"
          exit 1
