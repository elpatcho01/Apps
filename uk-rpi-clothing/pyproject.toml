[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-rpi-clothing-nowcast"
version = "0.1.0"
description = "Fixing exposure, Carli-wedge measurement and index-day nowcast for RPI clothing & footwear (ONS CHBJ)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "numpy>=2,<3",
    "google-cloud-bigquery>=3.25,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
